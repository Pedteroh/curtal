<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Criador de Currículo</title>
<meta name="description" content="Escolha um modelo, preencha seus dados e baixe o currículo em PNG ou PDF. Grátis, sem cadastro, funciona offline.">
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Currículo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Work+Sans:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: cabeçalho enxuto; abaixo, painel de edição à esquerda e papel A4 em escala à direita. No celular, abas Editar/Prévia. */
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef0f5; --panel:#ffffff; --stage:#dde1ea; --fg:#171b26; --muted:#586079;
  --line:#d6dae5; --field:#f7f8fb; --accent:#2443c4; --on-accent:#ffffff; --danger:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117; --panel:#171a22; --stage:#0b0c10; --fg:#e8eaf2; --muted:#9aa3b8;
    --line:#2a2f3d; --field:#1e222c; --accent:#8aa4ff; --on-accent:#10131c; --danger:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117; --panel:#171a22; --stage:#0b0c10; --fg:#e8eaf2; --muted:#9aa3b8;
  --line:#2a2f3d; --field:#1e222c; --accent:#8aa4ff; --on-accent:#10131c; --danger:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.45 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;height:100%;padding-block:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:40px;height:40px;border-radius:10px;flex:none}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:13px}
.link{background:none;border:0;padding:2px 0;color:var(--accent);cursor:pointer;font-weight:600;font-size:13px}
.link.danger{color:var(--danger)}

.tabs{display:none;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs button{border:0;background:var(--panel);color:var(--muted);padding:8px 16px;font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

.work{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;padding:0 18px 24px;min-width:0}
.preview{background:var(--stage);border:1px solid var(--line);border-radius:8px;overflow:auto;padding:16px;min-width:0}

.panel .sec{padding:18px 0;border-bottom:1px solid var(--line)}
.panel .sec:last-child{border-bottom:0}
.panel .sec>h2{margin:0 0 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.example{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;background:var(--field);font-size:13px;color:var(--muted)}

.f{display:grid;gap:4px;margin:0 0 10px;min-width:0}
.f>span{font-size:12.5px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=tel],textarea{
  font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;width:100%;min-width:0;
}
textarea{resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px;border:1px solid var(--line);background:var(--field);border-radius:8px;color:var(--accent);cursor:pointer}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl b{display:block;color:var(--fg);font-weight:600}
.tpl small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.tpl svg{display:block;width:44px;height:58px}
.colors{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.colors>span{font-size:12.5px;color:var(--muted);font-weight:500;margin-right:4px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.colors input[type=color]{width:32px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer}

.photo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.thumb{width:56px;height:56px;border-radius:50%;background:var(--field);border:1px solid var(--line);object-fit:cover;flex:none}
.photo .col{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.rep{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.rep-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:13px}

.meta{display:flex;justify-content:space-between;gap:12px;max-width:794px;margin:0 auto 10px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.stage{position:relative;max-width:794px;margin:0 auto}
.sheet-wrap{width:794px;transform-origin:0 0}
.marks{position:absolute;inset:0;pointer-events:none}
.pb{position:absolute;left:0;right:0;border-top:1px dashed #d0462b}
.pb span{position:absolute;right:6px;top:3px;font-size:11px;color:#d0462b;background:#fff;padding:0 5px}

.toast-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;max-width:420px}

@media (max-width:880px){
  .work{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex}
  .work[data-view="edit"] .preview{display:none}
  .work[data-view="preview"] .panel{display:none}
  .brand p{display:none}
}
@media (max-width:480px){
  .two{grid-template-columns:1fr}
  .tpls{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Folha do currículo (papel A4: 794 x 1123 px) ===== */
.sheet{
  width:794px;min-height:1123px;background:#ffffff;color:#1c1f26;
  font-size:13px;line-height:1.5;overflow-wrap:anywhere;
  box-shadow:0 1px 3px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.18);
}
.sheet h1,.sheet h2,.sheet h3,.sheet p,.sheet ul{margin:0}
.sheet ul{padding-left:18px}
.sheet li{margin-top:3px}
.sheet .ph{display:block;width:104px;height:104px;object-fit:cover;flex:none}
.sheet .ih{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.sheet .per{white-space:nowrap;color:#666;font-size:12px}
.sheet .item{margin-top:11px}
.sheet .item:first-child{margin-top:0}

/* 1. Clássico */
.t-classico{font-family:'Source Serif 4',Georgia,serif;padding:54px 60px;font-size:13.5px}
.t-classico .hd{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-bottom:18px;border-bottom:2px solid var(--ac)}
.t-classico h1{font-size:34px;font-weight:600;line-height:1.1;color:var(--ac)}
.t-classico .cargo{font-size:16px;font-style:italic;margin-top:4px;color:#444}
.t-classico .ct{margin-top:10px;font-size:12px;color:#555}
.t-classico .ct i{font-style:normal;margin:0 8px;color:var(--ac)}
.t-classico .ph{border-radius:50%;width:96px;height:96px}
.t-classico .sec{margin-top:22px}
.t-classico h2{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);font-weight:600;padding-bottom:5px;margin-bottom:10px;border-bottom:1px solid #dcdcdc}
.t-classico .org{color:#444}

/* 2. Lateral */
.t-lateral{font-family:'Work Sans',system-ui,sans-serif;display:grid;grid-template-columns:250px 1fr}
.t-lateral .sb{background:var(--ac);color:var(--on);padding:46px 26px}
.t-lateral .sb .ph{width:148px;height:148px;border-radius:50%;margin:0 auto 6px;border:3px solid var(--on-line)}
.t-lateral .sb h3{margin:26px 0 9px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--on-line)}
.t-lateral .sb h3:first-child{margin-top:0}
.t-lateral .cl{font-size:12px;margin-top:5px}
.t-lateral .mn{padding:54px 46px}
.t-lateral h1{font-size:33px;line-height:1.08;font-weight:700;letter-spacing:-.015em}
.t-lateral .cargo{margin-top:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--ac)}
.t-lateral .sec{margin-top:26px}
.t-lateral .mn .cargo+.sec{margin-top:28px}
.t-lateral h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:11px;color:var(--ac)}

/* 3. Moderno */
.t-moderno{font-family:'Outfit',system-ui,sans-serif;font-size:13.5px;display:flex;flex-direction:column}
.t-moderno .band{background:var(--ac);color:var(--on);padding:46px 56px 38px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.t-moderno h1{font-size:42px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.t-moderno .cargo{font-size:18px;font-weight:300;margin-top:6px}
.t-moderno .ct{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:16px;font-size:12px}
.t-moderno .ph{width:116px;height:116px;border-radius:16px;border:3px solid var(--on-line)}
.t-moderno .bd{flex:1;display:grid;grid-template-columns:1fr 210px;gap:34px;padding:0 0 0 56px}
.t-moderno .col{padding:34px 0 50px}
.t-moderno .side{background:var(--tint);padding:30px 20px}
.t-moderno .sec{margin-top:24px}
.t-moderno .sec:first-child{margin-top:0}
.t-moderno h2{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.t-moderno .chip{display:inline-block;margin:0 5px 6px 0;padding:2px 10px;border:1px solid var(--ac);border-radius:999px;font-size:11.5px}
.t-moderno .ln{margin-top:5px;font-size:12.5px}

/* 4. Minimal */
.t-minimal{font-family:'IBM Plex Sans',system-ui,sans-serif;padding:64px 60px;font-size:13px}
.t-minimal .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:30px}
.t-minimal h1{font-size:40px;font-weight:300;letter-spacing:-.025em;line-height:1.05}
.t-minimal .cargo{margin-top:12px;font:500 11.5px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.t-minimal .ph{width:92px;height:92px;border-radius:2px}
.t-minimal .row{display:grid;grid-template-columns:128px 1fr;gap:24px;padding:20px 0;border-top:1px solid #e2e2e2}
.t-minimal .lb{font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);padding-top:3px}
.t-minimal .cn div+div{margin-top:3px}

/* 5. Linha do tempo */
.t-timeline{font-family:'DM Sans',system-ui,sans-serif;padding:52px 56px;font-size:13.5px}
.t-timeline .hd{display:flex;justify-content:space-between;align-items:center;gap:24px}
.t-timeline h1{font-size:37px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.t-timeline .cargo{margin-top:6px;font-size:16px;font-weight:500;color:var(--ac)}
.t-timeline .ct{display:flex;flex-wrap:wrap;gap:3px 16px;margin-top:12px;font-size:12px;color:#55606f}
.t-timeline .ph{width:100px;height:100px;border-radius:50%;border:3px solid var(--soft)}
.t-timeline .sec{margin-top:26px}
.t-timeline h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ac);margin-bottom:12px}
.t-timeline .tl{position:relative;margin-left:5px;padding-left:24px;border-left:2px solid var(--soft)}
.t-timeline .tl .item{position:relative;margin-top:16px}
.t-timeline .tl .item:first-child{margin-top:0}
.t-timeline .tl .item::before{content:"";position:absolute;left:-32px;top:3px;width:8px;height:8px;border-radius:50%;background:#ffffff;border:3px solid var(--ac)}
.t-timeline .chip{display:inline-block;margin:0 6px 7px 0;padding:3px 11px;background:var(--tint);color:var(--ac);border-radius:4px;font-size:12px;font-weight:500}

/* 6. Executivo */
.t-executivo{font-family:'Source Serif 4',Georgia,serif;padding:52px 64px;font-size:13.5px}
.t-executivo .hd{text-align:center;padding-bottom:16px}
.t-executivo .ph{margin:0 auto 14px;width:92px;height:92px;border-radius:50%}
.t-executivo h1{font:600 36px/1.1 'Playfair Display',Georgia,serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ac)}
.t-executivo .cargo{margin-top:8px;font-size:16px;font-style:italic;color:#444}
.t-executivo .ct{margin-top:10px;font-size:12px;color:#555}
.t-executivo .ct i{font-style:normal;margin:0 10px;color:var(--ac)}
.t-executivo .rule{height:7px;border-top:1px solid var(--ac);border-bottom:3px solid var(--ac)}
.t-executivo .sec{margin-top:22px}
.t-executivo h2{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--ac);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #d9d9d9}
.t-executivo .duo{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.t-executivo .org{font-style:italic;color:#444}

/* 7. Tech */
.t-tech{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;display:flex;flex-direction:column}
.t-tech .band{background:#0f172a;color:#ffffff;padding:40px 52px 34px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.t-tech .who{display:flex;align-items:center;gap:20px}
.t-tech .ph{width:88px;height:88px;border-radius:12px;border:2px solid var(--ac-lite)}
.t-tech h1{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.t-tech .cargo{margin-top:8px;font:500 12.5px 'JetBrains Mono',monospace;color:var(--ac-lite);letter-spacing:.04em}
.t-tech .ct{font:400 11px/1.7 'JetBrains Mono',monospace;color:#cbd5e1;text-align:right}
.t-tech .bd{flex:1;display:grid;grid-template-columns:1fr 222px}
.t-tech .col{padding:30px 32px 44px 52px}
.t-tech .side{padding:30px 32px 44px 26px;border-left:1px solid #e2e8f0}
.t-tech .sec{margin-top:24px}
.t-tech .sec:first-child{margin-top:0}
.t-tech h2{font:500 12px 'JetBrains Mono',monospace;color:var(--ac);margin-bottom:10px;letter-spacing:.02em;text-transform:lowercase}
.t-tech h2::before{content:"// ";opacity:.5}
.t-tech .tag{display:inline-block;white-space:nowrap;margin:0 5px 6px 0;padding:2px 8px;border:1px solid var(--ac);border-radius:4px;font:400 11px 'JetBrains Mono',monospace;color:var(--ac)}
.t-tech .ln{margin-top:4px;font-size:12.5px}
.t-tech .org{color:var(--ac);font-weight:500}

/* 8. Compacto */
.t-compacto{font-family:'Source Sans 3',system-ui,sans-serif;font-size:12.5px;line-height:1.42;border-top:8px solid var(--ac)}
.t-compacto .hd{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:34px 48px 18px}
.t-compacto h1{font-size:31px;font-weight:700;line-height:1.1}
.t-compacto .cargo{margin-top:3px;font-size:14.5px;font-weight:600;color:var(--ac)}
.t-compacto .ct{margin-top:8px;font-size:12px;color:#555}
.t-compacto .ct i{font-style:normal;margin:0 7px;color:#aaaaaa}
.t-compacto .ph{width:76px;height:76px;border-radius:8px}
.t-compacto .bd{display:grid;grid-template-columns:1fr 190px;padding:0 48px 44px}
.t-compacto .col{padding-right:26px}
.t-compacto .side{padding-left:22px;border-left:1px solid #dcdcdc}
.t-compacto .sec{margin-top:16px}
.t-compacto .sec:first-child{margin-top:0}
.t-compacto h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ac);border-bottom:1.5px solid var(--ac);padding-bottom:3px;margin-bottom:8px}
.t-compacto .item{margin-top:8px}
.t-compacto .ln{margin-top:3px}
.t-compacto .side .ih{display:block}
.t-compacto .side .per{display:block;white-space:normal}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <img src="icon.svg" width="40" height="40" alt="">
      <div>
        <h1>Criador de Currículo</h1>
        <p>Escolha um modelo, preencha os campos e baixe em PNG ou PDF.</p>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Alternar painel">
      <button type="button" role="tab" id="tab-edit" aria-selected="true">Editar</button>
      <button type="button" role="tab" id="tab-preview" aria-selected="false">Prévia</button>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="btn-install" hidden>Instalar app</button>
      <button type="button" class="btn" id="btn-png">Baixar PNG</button>
      <button type="button" class="btn primary" id="btn-pdf">Baixar PDF</button>
    </div>
  </header>

  <main class="work" id="work" data-view="edit">
    <aside class="panel" id="panel">
      <div class="example" id="example">
        <span>Os campos já vêm com um exemplo. Substitua pelos seus dados.</span>
        <button type="button" class="link" id="btn-clear">Limpar tudo</button>
      </div>

      <section class="sec">
        <h2>Modelo</h2>
        <div class="tpls" id="tpls"></div>
        <div class="colors" id="colors"><span>Cor</span></div>
      </section>

      <section class="sec">
        <h2>Dados pessoais</h2>
        <div class="photo">
          <img class="thumb" id="thumb" alt="" hidden>
          <div class="col">
            <label class="btn small" for="foto">Escolher foto</label>
            <input id="foto" class="sr" type="file" accept="image/*">
            <button type="button" class="link danger" id="btn-foto-rm" hidden>Remover foto</button>
          </div>
        </div>
        <label class="f" for="nome"><span>Nome completo</span><input id="nome" type="text" data-k="nome" autocomplete="off"></label>
        <label class="f" for="cargo"><span>Cargo desejado</span><input id="cargo" type="text" data-k="cargo" autocomplete="off"></label>
        <div class="two">
          <label class="f" for="email"><span>E-mail</span><input id="email" type="email" data-k="email" autocomplete="off"></label>
          <label class="f" for="telefone"><span>Telefone</span><input id="telefone" type="tel" data-k="telefone" autocomplete="off"></label>
        </div>
        <div class="two">
          <label class="f" for="cidade"><span>Cidade e estado</span><input id="cidade" type="text" data-k="cidade" autocomplete="off"></label>
          <label class="f" for="link"><span>LinkedIn ou site</span><input id="link" type="text" data-k="link" autocomplete="off"></label>
        </div>
      </section>

      <section class="sec">
        <h2>Resumo profissional</h2>
        <label class="f" for="resumo"><span>Duas ou três frases sobre você</span><textarea id="resumo" data-k="resumo" rows="4"></textarea></label>
      </section>

      <section class="sec">
        <h2>Experiência</h2>
        <div id="list-experiencias"></div>
        <button type="button" class="btn small" data-act="add" data-list="experiencias">Adicionar experiência</button>
      </section>

      <section class="sec">
        <h2>Formação</h2>
        <div id="list-formacao"></div>
        <button type="button" class="btn small" data-act="add" data-list="formacao">Adicionar formação</button>
      </section>

      <section class="sec">
        <h2>Habilidades</h2>
        <label class="f" for="habilidades"><span>Separe por vírgula</span><textarea id="habilidades" data-k="habilidades" rows="3"></textarea></label>
      </section>

      <section class="sec">
        <h2>Idiomas</h2>
        <label class="f" for="idiomas"><span>Separe por vírgula, ex.: Inglês (avançado)</span><textarea id="idiomas" data-k="idiomas" rows="2"></textarea></label>
      </section>
    </aside>

    <section class="preview" id="preview">
      <div class="meta"><span id="pg">A4 · 1 página</span><span id="scale"></span></div>
      <div class="stage" id="stage">
        <div class="sheet-wrap" id="wrap"><article class="sheet t-classico" id="sheet"></article></div>
        <div class="marks" id="marks"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast-wrap" aria-live="polite"><div class="toast" id="toast" hidden></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  var PAGE_W = 794, PAGE_H = 1123, KEY = 'criador-curriculo-v1';
  var $ = function(id){ return document.getElementById(id); };

  var TEMPLATES = [
    {id:'classico', name:'Clássico', desc:'Uma coluna, texto serifado'},
    {id:'lateral', name:'Lateral', desc:'Barra de cor com foto e contatos'},
    {id:'moderno', name:'Moderno', desc:'Cabeçalho em bloco de cor'},
    {id:'minimal', name:'Minimal', desc:'Rótulos à esquerda, muito respiro'},
    {id:'timeline', name:'Linha do tempo', desc:'Trajetória em linha vertical'},
    {id:'executivo', name:'Executivo', desc:'Cabeçalho centralizado e formal'},
    {id:'tech', name:'Tech', desc:'Faixa escura e detalhes em mono'},
    {id:'compacto', name:'Compacto', desc:'Denso, cabe muita coisa em uma página'}
  ];
  var SWATCHES = [
    ['#1f4e79','Azul'],['#0f766e','Verde-petróleo'],['#9f1239','Vinho'],
    ['#4338ca','Índigo'],['#1f2937','Grafite'],['#b45309','Âmbar']
  ];

  function thumb(id){
    var g = 'fill="var(--muted)" opacity=".45"';
    var frame = '<rect x=".5" y=".5" width="43" height="57" rx="2" fill="var(--panel)" stroke="var(--line)"/>';
    var s = {
      classico: frame+'<rect x="6" y="7" width="22" height="4" fill="currentColor"/><rect x="6" y="14" width="32" height="1.5" fill="currentColor"/><g '+g+'><rect x="6" y="21" width="32" height="2"/><rect x="6" y="26" width="26" height="2"/><rect x="6" y="33" width="32" height="2"/><rect x="6" y="38" width="30" height="2"/><rect x="6" y="45" width="32" height="2"/></g>',
      lateral: frame+'<rect x=".5" y=".5" width="15" height="57" fill="currentColor"/><circle cx="8" cy="10" r="4" fill="#fff" opacity=".7"/><g '+g+'><rect x="20" y="8" width="18" height="3"/><rect x="20" y="18" width="20" height="2"/><rect x="20" y="23" width="16" height="2"/><rect x="20" y="31" width="20" height="2"/><rect x="20" y="36" width="18" height="2"/></g>',
      moderno: frame+'<rect x=".5" y=".5" width="43" height="16" fill="currentColor"/><rect x="29" y="38" width="14" height="19" fill="currentColor" opacity=".18"/><g '+g+'><rect x="6" y="23" width="18" height="2"/><rect x="6" y="28" width="20" height="2"/><rect x="6" y="36" width="18" height="2"/><rect x="6" y="41" width="20" height="2"/></g>',
      minimal: frame+'<rect x="6" y="7" width="20" height="3" fill="currentColor" opacity=".6"/><g fill="currentColor"><rect x="6" y="19" width="8" height="1.5"/><rect x="6" y="32" width="8" height="1.5"/><rect x="6" y="45" width="8" height="1.5"/></g><g '+g+'><rect x="18" y="19" width="20" height="2"/><rect x="18" y="24" width="16" height="2"/><rect x="18" y="32" width="20" height="2"/><rect x="18" y="37" width="14" height="2"/><rect x="18" y="45" width="20" height="2"/></g>',
      timeline: frame+'<rect x="6" y="7" width="22" height="4" fill="currentColor"/><rect x="6" y="13" width="14" height="2" fill="currentColor" opacity=".6"/><rect x="11" y="22" width="1.5" height="28" fill="currentColor" opacity=".5"/><g fill="currentColor"><circle cx="11.7" cy="24" r="2.4"/><circle cx="11.7" cy="35" r="2.4"/><circle cx="11.7" cy="46" r="2.4"/></g><g '+g+'><rect x="18" y="22" width="20" height="2"/><rect x="18" y="26" width="15" height="2"/><rect x="18" y="33" width="20" height="2"/><rect x="18" y="37" width="14" height="2"/><rect x="18" y="44" width="20" height="2"/></g>',
      executivo: frame+'<rect x="12" y="7" width="20" height="4" fill="currentColor"/><rect x="15" y="13" width="14" height="1.5" fill="currentColor" opacity=".6"/><rect x="6" y="18" width="32" height="1" fill="currentColor"/><rect x="6" y="20.5" width="32" height="2" fill="currentColor"/><g '+g+'><rect x="14" y="28" width="16" height="2"/><rect x="6" y="33" width="32" height="2"/><rect x="6" y="38" width="28" height="2"/><rect x="14" y="45" width="16" height="2"/></g>',
      tech: frame+'<path d="M.5 2.5a2 2 0 0 1 2-2h39a2 2 0 0 1 2 2V17H.5z" fill="#0f172a"/><rect x="6" y="6" width="16" height="3" fill="#fff"/><rect x="6" y="11" width="10" height="1.5" fill="currentColor"/><rect x="31" y="6" width="8" height="1.5" fill="#fff" opacity=".6"/><rect x="31" y="10" width="8" height="1.5" fill="#fff" opacity=".6"/><rect x="31" y="22" width="1" height="30" fill="var(--line)"/><g '+g+'><rect x="6" y="23" width="20" height="2"/><rect x="6" y="28" width="18" height="2"/><rect x="6" y="36" width="20" height="2"/><rect x="6" y="41" width="14" height="2"/></g><g fill="none" stroke="currentColor" stroke-width=".8"><rect x="34" y="24" width="6" height="3" rx=".8"/><rect x="34" y="30" width="6" height="3" rx=".8"/></g>',
      compacto: '<rect x=".5" y=".5" width="43" height="57" rx="2" fill="var(--panel)" stroke="var(--line)"/><rect x=".5" y=".5" width="43" height="3" fill="currentColor"/><rect x="5" y="8" width="18" height="3.5" fill="currentColor"/><rect x="5" y="14" width="12" height="1.5" fill="currentColor" opacity=".6"/><rect x="29" y="18" width="1" height="34" fill="var(--line)"/><g '+g+'><rect x="5" y="20" width="20" height="2"/><rect x="5" y="24" width="18" height="2"/><rect x="5" y="28" width="20" height="2"/><rect x="5" y="34" width="20" height="2"/><rect x="5" y="38" width="16" height="2"/><rect x="5" y="42" width="20" height="2"/><rect x="33" y="20" width="7" height="2"/><rect x="33" y="25" width="7" height="2"/><rect x="33" y="32" width="7" height="2"/></g>'
    };
    return '<svg viewBox="0 0 44 58" aria-hidden="true">'+s[id]+'</svg>';
  }

  function example(){
    return {
      nome:'Marina Duarte', cargo:'Analista de Marketing Digital',
      email:'marina.duarte@exemplo.com', telefone:'(11) 91234-5678',
      cidade:'São Paulo, SP', link:'linkedin.com/in/marinaduarte', foto:'',
      resumo:'Profissional com 5 anos de experiência em mídia paga, SEO e CRM. Usa dados para reduzir o custo de aquisição e aumentar a retenção de clientes em e-commerce.',
      experiencias:[
        {cargo:'Analista de Marketing Pleno', empresa:'Loja Aurora', periodo:'2022 – Atual',
         descricao:'Reduzi o custo por aquisição em 28% com testes de criativos no Meta e no Google Ads\nCoordenei o calendário de e-mail marketing para 120 mil contatos\nCriei painéis semanais no Looker Studio para a diretoria'},
        {cargo:'Assistente de Marketing', empresa:'Agência Prisma', periodo:'2019 – 2022',
         descricao:'Gerenciei redes sociais e mídia paga de 12 clientes\nProduzi relatórios mensais de desempenho com planos de otimização'}
      ],
      formacao:[
        {curso:'Pós-graduação em Marketing Digital', instituicao:'ESPM', periodo:'2020 – 2021'},
        {curso:'Bacharelado em Publicidade e Propaganda', instituicao:'Universidade Presbiteriana Mackenzie', periodo:'2015 – 2018'}
      ],
      habilidades:'Google Ads, Meta Ads, SEO, Google Analytics 4, E-mail marketing, Looker Studio, Excel avançado',
      idiomas:'Português (nativo), Inglês (avançado), Espanhol (intermediário)'
    };
  }
  function blank(){
    return {nome:'',cargo:'',email:'',telefone:'',cidade:'',link:'',foto:'',resumo:'',
      experiencias:[{cargo:'',empresa:'',periodo:'',descricao:''}],
      formacao:[{curso:'',instituicao:'',periodo:''}], habilidades:'', idiomas:''};
  }

  var state = {template:'classico', accent:'#1f4e79', example:true, data:example()};
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(saved && saved.data){
      state.template = saved.template || state.template;
      state.accent = saved.accent || state.accent;
      state.example = !!saved.example;
      state.data = Object.assign(blank(), saved.data);
      if(!Array.isArray(state.data.experiencias) || !state.data.experiencias.length) state.data.experiencias = blank().experiencias;
      if(!Array.isArray(state.data.formacao) || !state.data.formacao.length) state.data.formacao = blank().formacao;
    }
  }catch(e){}
  if(!TEMPLATES.some(function(t){return t.id===state.template;})) state.template = 'classico';
  if(!/^#[0-9a-fA-F]{6}$/.test(state.accent)) state.accent = '#1f4e79';

  /* ---------- helpers ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function lines(s){ return String(s||'').split(/\r?\n/).map(function(x){return x.replace(/^\s*[-•*]\s*/,'').trim();}).filter(Boolean); }
  function list(s){ return String(s||'').split(/[,;\n]/).map(function(x){return x.trim();}).filter(Boolean); }
  function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'novo'; }
  function mix(hex,p){
    var n=parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
    var m=function(c){return Math.round(c+(255-c)*p);};
    return '#'+[m(r),m(g),m(b)].map(function(x){return x.toString(16).padStart(2,'0');}).join('');
  }
  function themeVars(hex){
    var n=parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
    var lum=(0.299*r+0.587*g+0.114*b)/255, light=lum>0.62;
    return '--ac:'+hex+';--tint:'+mix(hex,0.9)+';--soft:'+mix(hex,0.7)+';--ac-lite:'+mix(hex,0.55)
      +';--on:'+(light?'#14171f':'#ffffff')+';--on-line:'+(light?'rgba(20,23,31,.3)':'rgba(255,255,255,.35)')+';';
  }

  /* ---------- modelos ---------- */
  function sec(title, html){ return html ? '<section class="sec"><h2>'+title+'</h2>'+html+'</section>' : ''; }
  function contacts(d){ return [d.email,d.telefone,d.cidade,d.link].filter(Boolean); }
  function NAME(d){ return esc(d.nome || 'Seu nome'); }
  function CARGO(d){ return d.cargo ? '<div class="cargo">'+esc(d.cargo)+'</div>' : ''; }
  function photo(d){ return d.foto ? '<img class="ph" src="'+esc(d.foto)+'" alt="">' : ''; }
  function sum(d){ return d.resumo ? '<p>'+esc(d.resumo)+'</p>' : ''; }
  function head(a,b,per){
    return '<div class="ih"><div class="it">'+(a?'<strong>'+esc(a)+'</strong>':'')+(b?'<span class="org">'+(a?' · ':'')+esc(b)+'</span>':'')+'</div>'+(per?'<span class="per">'+esc(per)+'</span>':'')+'</div>';
  }
  function expH(d){
    return d.experiencias.filter(function(e){return e.cargo||e.empresa||e.periodo||e.descricao;}).map(function(e){
      var ls=lines(e.descricao);
      return '<div class="item">'+head(e.cargo,e.empresa,e.periodo)+(ls.length?'<ul>'+ls.map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>':'')+'</div>';
    }).join('');
  }
  function eduH(d){
    return d.formacao.filter(function(e){return e.curso||e.instituicao||e.periodo;}).map(function(e){
      return '<div class="item">'+head(e.curso,e.instituicao,e.periodo)+'</div>';
    }).join('');
  }
  function joined(arr,sep){ return arr.length ? '<p>'+arr.map(esc).join(sep)+'</p>' : ''; }
  function lns(arr,cls){ return arr.map(function(x){return '<div class="'+cls+'">'+esc(x)+'</div>';}).join(''); }
  function pills(arr,cls){ return arr.map(function(x){return '<span class="'+cls+'">'+esc(x)+'</span>';}).join(''); }

  var TPL = {
    classico:function(d){
      return '<header class="hd"><div><h1>'+NAME(d)+'</h1>'+CARGO(d)+'<div class="ct">'+contacts(d).map(esc).join('<i>·</i>')+'</div></div>'+photo(d)+'</header>'
        + sec('Resumo',sum(d)) + sec('Experiência',expH(d)) + sec('Formação',eduH(d))
        + sec('Habilidades',joined(list(d.habilidades),' · ')) + sec('Idiomas',joined(list(d.idiomas),' · '));
    },
    lateral:function(d){
      function sb(t,h){ return h ? '<h3>'+t+'</h3>'+h : ''; }
      return '<aside class="sb">'+photo(d)+sb('Contato',lns(contacts(d),'cl'))+sb('Habilidades',lns(list(d.habilidades),'cl'))+sb('Idiomas',lns(list(d.idiomas),'cl'))+'</aside>'
        + '<div class="mn"><h1>'+NAME(d)+'</h1>'+CARGO(d)+sec('Resumo',sum(d))+sec('Experiência',expH(d))+sec('Formação',eduH(d))+'</div>';
    },
    moderno:function(d){
      return '<header class="band"><div><h1>'+NAME(d)+'</h1>'+CARGO(d)+'<div class="ct">'+pills(contacts(d),'')+'</div></div>'+photo(d)+'</header>'
        + '<div class="bd"><div class="col">'+sec('Resumo',sum(d))+sec('Experiência',expH(d))+sec('Formação',eduH(d))+'</div>'
        + '<aside class="side">'+sec('Habilidades',pills(list(d.habilidades),'chip'))+sec('Idiomas',lns(list(d.idiomas),'ln'))+'</aside></div>';
    },
    minimal:function(d){
      function row(l,h){ return h ? '<div class="row"><div class="lb">'+l+'</div><div class="cn">'+h+'</div></div>' : ''; }
      return '<header class="hd"><div><h1>'+NAME(d)+'</h1>'+CARGO(d)+'</div>'+photo(d)+'</header>'
        + row('Perfil',sum(d)) + row('Experiência',expH(d)) + row('Formação',eduH(d))
        + row('Contato',lns(contacts(d),'')) + row('Habilidades',joined(list(d.habilidades),', ')) + row('Idiomas',joined(list(d.idiomas),', '));
    },
    timeline:function(d){
      function tl(h){ return h ? '<div class="tl">'+h+'</div>' : ''; }
      return '<header class="hd"><div><h1>'+NAME(d)+'</h1>'+CARGO(d)+'<div class="ct">'+pills(contacts(d),'')+'</div></div>'+photo(d)+'</header>'
        + sec('Resumo',sum(d)) + sec('Experiência',tl(expH(d))) + sec('Formação',tl(eduH(d)))
        + sec('Habilidades',pills(list(d.habilidades),'chip')) + sec('Idiomas',pills(list(d.idiomas),'chip'));
    },
    executivo:function(d){
      var duo = sec('Habilidades',joined(list(d.habilidades),' • ')) + sec('Idiomas',joined(list(d.idiomas),' • '));
      return '<header class="hd">'+photo(d)+'<h1>'+NAME(d)+'</h1>'+CARGO(d)+'<div class="ct">'+contacts(d).map(esc).join('<i>|</i>')+'</div></header><div class="rule"></div>'
        + sec('Resumo',sum(d)) + sec('Experiência',expH(d)) + sec('Formação',eduH(d))
        + (duo ? '<div class="duo">'+duo+'</div>' : '');
    },
    tech:function(d){
      return '<header class="band"><div class="who">'+photo(d)+'<div><h1>'+NAME(d)+'</h1>'+CARGO(d)+'</div></div><div class="ct">'+lns(contacts(d),'')+'</div></header>'
        + '<div class="bd"><div class="col">'+sec('Resumo',sum(d))+sec('Experiência',expH(d))+sec('Formação',eduH(d))+'</div>'
        + '<aside class="side">'+sec('Habilidades',pills(list(d.habilidades),'tag'))+sec('Idiomas',lns(list(d.idiomas),'ln'))+'</aside></div>';
    },
    compacto:function(d){
      return '<header class="hd"><div><h1>'+NAME(d)+'</h1>'+CARGO(d)+'<div class="ct">'+contacts(d).map(esc).join('<i>|</i>')+'</div></div>'+photo(d)+'</header>'
        + '<div class="bd"><div class="col">'+sec('Resumo',sum(d))+sec('Experiência',expH(d))+'</div>'
        + '<aside class="side">'+sec('Formação',eduH(d))+sec('Habilidades',lns(list(d.habilidades),'ln'))+sec('Idiomas',lns(list(d.idiomas),'ln'))+'</aside></div>';
    }
  };

  /* ---------- prévia ---------- */
  var sheet=$('sheet'), wrap=$('wrap'), stage=$('stage'), marks=$('marks');
  var scale=1;
  function fit(){
    var avail = stage.clientWidth; if(!avail) return;
    scale = Math.min(1, avail/PAGE_W);
    wrap.style.transform = 'scale('+scale+')';
    var h = sheet.offsetHeight, pages = Math.max(1, Math.ceil(h/PAGE_H));
    stage.style.height = (h*scale)+'px';
    var m=''; for(var k=1;k<pages;k++){ m += '<div class="pb" style="top:'+(k*PAGE_H*scale)+'px"><span>Página '+(k+1)+'</span></div>'; }
    marks.innerHTML = m;
    $('pg').textContent = 'A4 · '+pages+(pages>1?' páginas':' página');
    $('scale').textContent = Math.round(scale*100)+'%';
  }
  function renderSheet(){
    sheet.className = 'sheet t-'+state.template;
    sheet.setAttribute('style', themeVars(state.accent));
    sheet.innerHTML = TPL[state.template](state.data);
    fit();
  }
  var saveT;
  function persist(){
    clearTimeout(saveT);
    saveT = setTimeout(function(){
      try{ localStorage.setItem(KEY, JSON.stringify({template:state.template,accent:state.accent,example:state.example,data:state.data})); }catch(e){}
    },400);
  }
  function update(){ renderSheet(); persist(); }

  /* ---------- formulário ---------- */
  function buildTemplates(){
    $('tpls').innerHTML = TEMPLATES.map(function(t){
      return '<button type="button" class="tpl" data-tpl="'+t.id+'" aria-pressed="'+(state.template===t.id)+'">'+thumb(t.id)+'<span><b>'+t.name+'</b><small>'+t.desc+'</small></span></button>';
    }).join('');
  }
  function buildColors(){
    $('colors').innerHTML = '<span>Cor</span>'+SWATCHES.map(function(c){
      return '<button type="button" class="sw" data-color="'+c[0]+'" style="background:'+c[0]+'" aria-label="'+c[1]+'" aria-pressed="'+(state.accent.toLowerCase()===c[0])+'"></button>';
    }).join('')+'<input type="color" id="color-custom" value="'+state.accent+'" aria-label="Escolher outra cor">';
  }
  function repHtml(listName){
    var d = state.data[listName];
    if(listName==='experiencias'){
      return d.map(function(e,i){
        var p='exp-'+i;
        return '<div class="rep" data-list="experiencias" data-i="'+i+'"><div class="rep-h"><span>Experiência '+(i+1)+'</span><button type="button" class="link danger" data-act="del" data-list="experiencias" data-i="'+i+'">Remover</button></div>'
          +'<label class="f" for="'+p+'-cargo"><span>Cargo</span><input id="'+p+'-cargo" type="text" data-f="cargo" value="'+esc(e.cargo)+'" autocomplete="off"></label>'
          +'<div class="two"><label class="f" for="'+p+'-empresa"><span>Empresa</span><input id="'+p+'-empresa" type="text" data-f="empresa" value="'+esc(e.empresa)+'" autocomplete="off"></label>'
          +'<label class="f" for="'+p+'-periodo"><span>Período</span><input id="'+p+'-periodo" type="text" data-f="periodo" value="'+esc(e.periodo)+'" autocomplete="off"></label></div>'
          +'<label class="f" for="'+p+'-desc"><span>Conquistas (uma por linha)</span><textarea id="'+p+'-desc" data-f="descricao" rows="4">'+esc(e.descricao)+'</textarea></label></div>';
      }).join('');
    }
    return d.map(function(e,i){
      var p='edu-'+i;
      return '<div class="rep" data-list="formacao" data-i="'+i+'"><div class="rep-h"><span>Formação '+(i+1)+'</span><button type="button" class="link danger" data-act="del" data-list="formacao" data-i="'+i+'">Remover</button></div>'
        +'<label class="f" for="'+p+'-curso"><span>Curso</span><input id="'+p+'-curso" type="text" data-f="curso" value="'+esc(e.curso)+'" autocomplete="off"></label>'
        +'<div class="two"><label class="f" for="'+p+'-inst"><span>Instituição</span><input id="'+p+'-inst" type="text" data-f="instituicao" value="'+esc(e.instituicao)+'" autocomplete="off"></label>'
        +'<label class="f" for="'+p+'-periodo"><span>Período</span><input id="'+p+'-periodo" type="text" data-f="periodo" value="'+esc(e.periodo)+'" autocomplete="off"></label></div></div>';
    }).join('');
  }
  function buildLists(){
    $('list-experiencias').innerHTML = repHtml('experiencias');
    $('list-formacao').innerHTML = repHtml('formacao');
  }
  function syncFields(){
    document.querySelectorAll('[data-k]').forEach(function(el){ el.value = state.data[el.dataset.k] || ''; });
    syncPhoto();
    $('example').hidden = !state.example;
  }
  function syncPhoto(){
    var f = state.data.foto;
    $('thumb').hidden = !f; if(f) $('thumb').src = f;
    $('btn-foto-rm').hidden = !f;
  }
  function buildSwatchState(){
    document.querySelectorAll('.sw').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.color === state.accent.toLowerCase())); });
  }

  var panel = $('panel');
  panel.addEventListener('input', function(e){
    var t = e.target, d = state.data;
    if(t.dataset.k){ d[t.dataset.k] = t.value; }
    else if(t.dataset.f){
      var rep = t.closest('.rep'); if(!rep) return;
      d[rep.dataset.list][+rep.dataset.i][t.dataset.f] = t.value;
    } else if(t.id === 'color-custom'){
      state.accent = t.value; buildSwatchState();
    } else return;
    if(state.example){ state.example = false; $('example').hidden = true; }
    update();
  });
  panel.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    if(b.dataset.tpl){
      state.template = b.dataset.tpl;
      document.querySelectorAll('.tpl').forEach(function(x){ x.setAttribute('aria-pressed', String(x===b)); });
      update(); return;
    }
    if(b.dataset.color){
      state.accent = b.dataset.color; $('color-custom').value = state.accent; buildSwatchState(); update(); return;
    }
    if(b.dataset.act === 'add'){
      var ln = b.dataset.list;
      state.data[ln].push(ln==='experiencias' ? {cargo:'',empresa:'',periodo:'',descricao:''} : {curso:'',instituicao:'',periodo:''});
      buildLists(); update();
      var items = $('list-'+ln).querySelectorAll('.rep'); var last = items[items.length-1];
      if(last){ var inp = last.querySelector('input'); if(inp) inp.focus(); }
      return;
    }
    if(b.dataset.act === 'del'){
      var l2 = b.dataset.list, arr = state.data[l2];
      arr.splice(+b.dataset.i,1);
      if(!arr.length) arr.push(l2==='experiencias' ? {cargo:'',empresa:'',periodo:'',descricao:''} : {curso:'',instituicao:'',periodo:''});
      buildLists(); update(); return;
    }
    if(b.id === 'btn-foto-rm'){ state.data.foto=''; syncPhoto(); update(); return; }
    if(b.id === 'btn-clear'){
      state.data = blank(); state.example = false;
      buildLists(); syncFields(); update(); $('nome').focus(); return;
    }
  });
  $('foto').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var s = Math.min(im.width, im.height), cv = document.createElement('canvas');
        cv.width = cv.height = 400;
        cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,400,400);
        state.data.foto = cv.toDataURL('image/jpeg',0.9);
        state.example = false; $('example').hidden = true;
        syncPhoto(); update();
      };
      im.onerror = function(){ toast('Não foi possível abrir essa imagem. Use JPG ou PNG.'); };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
    e.target.value = '';
  });

  /* ---------- abas (celular) ---------- */
  function setView(v){
    $('work').dataset.view = v;
    $('tab-edit').setAttribute('aria-selected', String(v==='edit'));
    $('tab-preview').setAttribute('aria-selected', String(v==='preview'));
    if(v==='preview') requestAnimationFrame(fit);
  }
  $('tab-edit').addEventListener('click', function(){ setView('edit'); });
  $('tab-preview').addEventListener('click', function(){ setView('preview'); });

  /* ---------- aviso ---------- */
  var toastT, toastEl = $('toast');
  function toast(msg, ms){
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.hidden = true; }, ms || 3500);
  }
  function hideToast(){ clearTimeout(toastT); toastEl.hidden = true; }

  /* ---------- exportação ---------- */
  var busy = false;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

  function setBusy(v){ busy = v; $('btn-png').disabled = $('btn-pdf').disabled = v; }

  /* Salva o arquivo: no app instalado do iPhone abre a folha de compartilhamento; nos demais, baixa direto. */
  async function saveFile(name, blob, type){
    if(isIOS && standalone && navigator.canShare && window.File){
      var file = new File([blob], name, {type:type});
      if(navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:name}); return; }
        catch(e){ if(e && e.name === 'AbortError') return; }
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }

  async function capture(){
    var h = sheet.offsetHeight, pages = Math.max(1, Math.ceil(h/PAGE_H));
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    var canvas = await html2canvas(sheet, {
      scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false, windowWidth:1280,
      onclone:function(doc){
        var el = doc.getElementById('sheet');
        var box = doc.createElement('div');
        box.style.cssText = 'position:absolute;left:0;top:0;width:'+PAGE_W+'px;background:#fff;z-index:2147483647';
        el.style.minHeight = (pages*PAGE_H)+'px';
        el.style.transform = 'none';
        el.style.boxShadow = 'none';
        box.appendChild(el);
        doc.body.appendChild(box);
      }
    });
    return {canvas:canvas, pages:pages};
  }
  async function doExport(kind){
    if(busy) return;
    if(!window.html2canvas || (kind==='pdf' && !(window.jspdf && window.jspdf.jsPDF))){
      toast('A ferramenta de exportação não carregou. Conecte-se à internet uma vez e recarregue a página.', 6000); return;
    }
    setBusy(true); toast(kind==='pdf' ? 'Gerando PDF…' : 'Gerando imagem…', 60000);
    try{
      var r = await capture(), canvas = r.canvas, pages = r.pages;
      var base = 'curriculo-'+slug(state.data.nome || 'novo');
      if(kind === 'png'){
        var blob = await new Promise(function(res){ canvas.toBlob(res,'image/png'); });
        if(!blob) throw new Error('blob');
        await saveFile(base+'.png', blob, 'image/png');
      } else {
        var pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
        var ph = Math.round(canvas.width*PAGE_H/PAGE_W);
        for(var i=0;i<pages;i++){
          var tmp = document.createElement('canvas'); tmp.width = canvas.width; tmp.height = ph;
          var ctx = tmp.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,tmp.width,tmp.height);
          ctx.drawImage(canvas, 0, -i*ph);
          if(i) pdf.addPage();
          pdf.addImage(tmp.toDataURL('image/jpeg',0.95),'JPEG',0,0,210,297);
        }
        await saveFile(base+'.pdf', pdf.output('blob'), 'application/pdf');
      }
      toast('Arquivo pronto.');
    }catch(e){
      toast('Não foi possível gerar o arquivo. Tente novamente.', 5000);
    }finally{
      setBusy(false);
    }
  }
  $('btn-png').addEventListener('click', function(){ doExport('png'); });
  $('btn-pdf').addEventListener('click', function(){ doExport('pdf'); });

  /* ---------- instalar como app (PWA) ---------- */
  var installEvt = null, installBtn = $('btn-install');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); installEvt = e; installBtn.hidden = false;
  });
  window.addEventListener('appinstalled', function(){ installEvt = null; installBtn.hidden = true; toast('App instalado.'); });
  if(isIOS && !standalone){ installBtn.hidden = false; }
  installBtn.addEventListener('click', async function(){
    if(installEvt){
      installEvt.prompt();
      try{ await installEvt.userChoice; }catch(e){}
      installEvt = null; installBtn.hidden = true;
    } else {
      toast('No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início.', 8000);
    }
  });
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  /* ---------- início ---------- */
  buildTemplates(); buildColors(); buildLists(); syncFields(); renderSheet();
  if(window.ResizeObserver){ new ResizeObserver(function(){ fit(); }).observe($('preview')); }
  window.addEventListener('resize', fit);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fit); }
})();
</script>
</body>
</html>
